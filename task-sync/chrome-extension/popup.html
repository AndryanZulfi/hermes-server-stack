<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    h3 {
      margin: 0 0 4px 0;
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      margin: 0 0 12px 0;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 600;
      background: #1e293b;
      color: #cbd5e1;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:active {
      transform: scale(0.98);
    }
    #status {
      margin-top: 12px;
      font-size: 11px;
      padding: 8px;
      border-radius: 6px;
      background: #1e293b;
      display: none;
      word-break: break-all;
    }
    .success {
      border-left: 3px solid #22c55e;
      color: #4ade80;
    }
    .error {
      border-left: 3px solid #ef4444;
      color: #f87171;
    }
  </style>
</head>
<body>
  <h3>⚡ Task IDN Sync</h3>
  <p>Auto-sync session token ke server deb-zlf.</p>
  <div class="badge">Target: 172.23.0.134:8089</div>
  
  <button id="btnSync">Kirim Token Sekarang</button>
  
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
